name: Quarterly 13F Ingestion & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Peak 13F filing deadline days (Feb, May, Aug, Nov 11-19): 23:15 UTC (post SEC close) & 05:15 UTC
    - cron: '15 5,23 11-19 2,5,8,11 *'
    # Season early/amendment checkpoints in Feb, May, Aug, Nov at 05:15 UTC
    - cron: '15 5 1,5,8,10,21,25,28 2,5,8,11 *'
    # Weekly Saturday morning full-market, 13F-HR/A, 13D/13G & XBRL fundamentals refresh
    - cron: '15 6 * * 6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-13f-sync
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run Python pipeline unit tests
        run: PYTHONPATH=pipeline python3 -m unittest discover -s pipeline -p "test_*.py" -v

      - name: Compute cache time buckets (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "CACHE_MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
          echo "CACHE_WEEK=$(date -u +%Y-W%V)" >> "$GITHUB_ENV"

      - name: Restore immutable SEC bulk ZIP cache (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: pipeline/cache/bulk
          key: sec-bulk-zips-v4-${{ env.CACHE_MONTH }}
          restore-keys: |
            sec-bulk-zips-v4-

      - name: Restore mutable SEC/Yahoo/resolver caches (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: |
            pipeline/cache/prices
            pipeline/cache/sec
            pipeline/cusip_cache.json
            pipeline/ticker_meta_cache.json
            pipeline/fundamentals_cache.json
          key: sec-mutable-v4-${{ env.CACHE_WEEK }}-${{ github.run_id }}
          restore-keys: |
            sec-mutable-v4-${{ env.CACHE_WEEK }}-
            sec-mutable-v4-

      - name: Sync latest data-snapshot branch (push/PR only)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
            git fetch --depth=1 origin data-snapshot:refs/remotes/origin/data-snapshot
            rm -rf public/data
            mkdir -p public/data
            git archive origin/data-snapshot public/data | tar -x
            echo "Loaded public/data from orphan data-snapshot branch."
          else
            echo "data-snapshot branch not initialized yet; using repository public/data."
          fi

      - name: Run SEC EDGAR 13F pipeline (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_USER_AGENT: "PaperTrail13FResearch contact@papertrail13f.dev"
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python3 -u pipeline/build_data.py

      - name: Verify sharded dataset integrity (strict on pipeline rebuilds)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 pipeline/validate_dataset.py --data-dir public/data --strict
          else
            python3 pipeline/validate_dataset.py --data-dir public/data
          fi

      - name: Publish dataset snapshot to orphan data-snapshot branch (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          SNAP_DIR="$(mktemp -d)"
          mkdir -p "$SNAP_DIR/public"
          cp -R public/data "$SNAP_DIR/public/data"
          REMOTE_URL="$(git remote get-url origin)"
          AUTH_HEADER="$(git config --get http.https://github.com/.extraheader || true)"
          git -C "$SNAP_DIR" init -q
          git -C "$SNAP_DIR" checkout --orphan data-snapshot
          git -C "$SNAP_DIR" config user.name "github-actions[bot]"
          git -C "$SNAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$AUTH_HEADER" ]; then
            git -C "$SNAP_DIR" config http.https://github.com/.extraheader "$AUTH_HEADER"
          fi
          git -C "$SNAP_DIR" add public/data
          git -C "$SNAP_DIR" commit -q -m "chore(data): automated 13F/13D-13G & Form 4 data snapshot ($(date -u +%Y-%m-%d))"
          git -C "$SNAP_DIR" remote add origin "$REMOTE_URL"
          git -C "$SNAP_DIR" push --force origin HEAD:refs/heads/data-snapshot
          rm -rf "$SNAP_DIR"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint and run frontend unit tests
        run: |
          npm run lint
          npm test

      - name: Typecheck & build static bundle
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
