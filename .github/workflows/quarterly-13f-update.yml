name: Quarterly 13F Ingestion & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Peak 13F filing deadline days (Feb, May, Aug, Nov 11-19): 23:15 UTC (post SEC close) & 05:15 UTC
    - cron: '15 5,23 11-19 2,5,8,11 *'
    # Season early/amendment checkpoints in Feb, May, Aug, Nov at 05:15 UTC
    - cron: '15 5 1,5,8,10,21,25,28 2,5,8,11 *'
    # Weekly Saturday morning full-market, 13F-HR/A, 13D/13G & XBRL fundamentals refresh
    - cron: '15 6 * * 6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-13f-sync
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run Python pipeline unit tests
        run: PYTHONPATH=pipeline python3 -m unittest discover -s pipeline -p "test_*.py" -v

      - name: Restore SEC EDGAR & Yahoo cache (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: sec-edgar-cache-v3-${{ github.run_id }}
          restore-keys: |
            sec-edgar-cache-v3-

      - name: Run SEC EDGAR 13F pipeline (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_USER_AGENT: "PaperTrail13FResearch contact@papertrail13f.dev"
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python3 -u pipeline/build_data.py

      - name: Verify sharded dataset integrity before commit/deploy
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data_dir = Path("public/data")
          summary_path = data_dir / "summary.json"
          assert summary_path.exists() and summary_path.stat().st_size >= 150_000, (
              f"Summary missing or too small: {summary_path.stat().st_size if summary_path.exists() else 0}B"
          )
          d = json.loads(summary_path.read_text(encoding="utf-8"))
          m = d["metadata"]
          assert m["qualifiedFundsCount"] >= 25, f"Too few qualified funds: {m}"
          assert m["elite50Count"] >= 25, f"Too few Elite 50 funds: {m}"
          assert m["total13fFilingsProcessed"] >= 100, f"Too few filings: {m}"
          assert len(d.get("funds", [])) >= 25, "Missing funds list"
          assert len(d.get("fundUpdates", [])) >= 15, "Missing fundUpdates list"
          assert len(d.get("idealPortfolio", {}).get("positions", [])) >= 15, "Missing idealPortfolio positions"
          assert len(d.get("stocksIndex", {})) >= 100, "Missing stocksIndex entries"
          assert isinstance(d.get("signalScreener"), dict), "Missing signalScreener"

          for i in range(16):
              fp = data_dir / f"funds_{i:x}.json"
              assert fp.exists(), f"Missing fund shard {fp}"
              obj = json.loads(fp.read_text(encoding="utf-8"))
              assert "funds" in obj and "updates" in obj, f"Invalid fund shard {fp}"
          for i in range(8):
              sp = data_dir / f"stocks_{i}.json"
              assert sp.exists(), f"Missing stock shard {sp}"
              json.loads(sp.read_text(encoding="utf-8"))

          uf = m.get("universeFunnel") or {}
          assert uf.get("totalCiksScanned", 0) >= 5000, f"Unexpected low totalCiksScanned in universeFunnel: {uf}"
          assert uf.get("qualifiedFundsCount") == m["qualifiedFundsCount"], "Funnel qualified count mismatch"
          print(
              f"Dataset verified: {uf.get('totalCiksScanned', 0)} SEC CIKs -> {m['qualifiedFundsCount']} qualified funds "
              f"({m.get('elite50Count', 0)} Elite 50 / {m.get('leaderboardEligibleCount', 0)} Eligible), "
              f"{len(d['stocksIndex'])} indexed stocks, {len(d.get('midQuarterAlerts', []))} 13D/13G alerts"
          )

          gh_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if gh_summary and uf:
              lines = [
                  f"## Paper Trail Full-Universe 13F Funnel ({m.get('latestQuarterCovered', '')})",
                  "",
                  f"**Method:** {uf.get('method', '')} ({uf.get('bulkDatasetsCount', 0)} bulk ZIPs through `{uf.get('bulkMaxFilingDate', '')}` + {uf.get('postBulkFilingsCount', 0):,} post-bulk filings)",
                  "",
                  "| Stage | Filter Description | Count |",
                  "|---|---|---:|",
                  f"| 1. Universe Scanned | All SEC 13F-HR / 13F-HR/A filers (2021–Present) | {uf.get('totalCiksScanned', 0):,} |",
                  f"| 2. Active Managers | Filed within 210 days / current filing cycle | {uf.get('activeRecentCount', 0):,} |",
                  f"| 3. Manager Filter | Exclude operating corps, mega-banks, insurers, pensions | {uf.get('nonExcludedManagerCount', 0):,} |",
                  f"| 4. Filing History | ≥4 quarters since 2024-01-01 | {uf.get('fourPlusQuartersCount', 0):,} |",
                  f"| 5. Scale Screen | ≥$200M reported / ≥$100M single-stock equity AUM | {uf.get('sizeAndEquityPassCount', 0):,} |",
                  f"| 6. Concentration | 5+ pos, effN ≥ 1.4, & ≤130 pos (or ≤265 w/ Top-10 ≥48%) | {uf.get('concentrationPassCount', 0):,} |",
                  f"| 7. Tech/TMT Focus | ≥35% Tech/TMT + SEC entityType/SIC check | {uf.get('techFloorPassCount', 0):,} |",
                  f"| 8. Strict Audit | Rolling 4Q median Tech/TMT persistence & breadth | {uf.get('strictQualificationCount', 0):,} |",
                  f"| 9. Priced History Qualified | ≥$100M & ≥70% single-stock equity w/ price history | {uf.get('qualifiedFundsCount', 0):,} |",
                  f"| 10. Leaderboard Eligible / Elite 50 | Anti-SPV cohort ({uf.get('leaderboardEligibleCount', 0)}) → Elite 50 Skill Cohort ({uf.get('elite50Count', 0)}) | {uf.get('leaderboardEligibleCount', 0)} / {uf.get('elite50Count', 0)} |",
                  f"| 11. Top-100 Union | Ranked Top 100 in any window (QE / 45d Lag) | {uf.get('rankedUnionQeCount', 0):,} / {uf.get('rankedUnionLagCount', 0):,} |",
                  f"| 12. Sharded UI Output | Ideal Positions / Indexed Stocks / 13D-13G Alerts | {uf.get('idealPortfolioCount', 0)} / {uf.get('stocksIndexedCount', 0):,} / {uf.get('midQuarterAlertsCount', 0)} |",
              ]
              with open(gh_summary, "a", encoding="utf-8") as sf:
                  sf.write("\n".join(lines) + "\n")
          PY

      - name: Commit updated sharded 13F dataset & caches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ pipeline/cusip_cache.json pipeline/ticker_meta_cache.json pipeline/fundamentals_cache.json
          if git ls-files --error-unmatch src/data/portfolio_data.json >/dev/null 2>&1; then
            git rm -f --ignore-unmatch src/data/portfolio_data.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): automated 13F/13D-13G & market data update"
            git fetch origin main && git rebase origin/main || { git rebase --abort; exit 1; }
            git push
          else
            echo "No dataset changes to commit."
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint and run frontend unit tests
        run: |
          npm run lint
          npm test

      - name: Typecheck & build static bundle
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
