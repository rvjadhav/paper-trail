name: Quarterly 13F Ingestion & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Peak 13F filing seasons (Feb, May, Aug, Nov) at 23:00 UTC (after SEC 5:30 PM ET close)
    - cron: '0 23 1,8,10,12,14,15,16,18,20,25 2,5,8,11 *'
    # Off-peak Sunday weekly market price & amendment refresh (never overlaps peak filing days)
    - cron: '0 23 * 1,3,4,6,7,9,10,12 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-13f-sync
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Restore SEC EDGAR & Yahoo cache (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: sec-edgar-cache-v2-${{ github.run_id }}
          restore-keys: |
            sec-edgar-cache-v2-

      - name: Run SEC EDGAR 13F pipeline (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_USER_AGENT: "PaperTrail13FResearch contact@papertrail13f.dev"
        run: python3 -u pipeline/build_data.py

      - name: Verify dataset integrity before commit/deploy
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("src/data/portfolio_data.json")
          assert p.exists() and p.stat().st_size >= 500_000, f"Dataset too small: {p.stat().st_size if p.exists() else 0}B"
          d = json.loads(p.read_text(encoding="utf-8"))
          m = d["metadata"]
          assert m["qualifiedFundsCount"] >= 25, f"Too few qualified funds: {m}"
          assert m["total13fFilingsProcessed"] >= 100, f"Too few filings: {m}"
          assert len(d.get("funds", [])) >= 25, "Missing funds list"
          assert len(d.get("fundUpdates", [])) >= 15, "Missing fundUpdates list"
          assert len(d.get("idealPortfolio", {}).get("positions", [])) >= 15, "Missing idealPortfolio positions"

          uf = m.get("universeFunnel") or {}
          assert uf.get("totalCiksScanned", 0) >= 5000, f"Unexpected low totalCiksScanned in universeFunnel: {uf}"
          assert uf.get("qualifiedFundsCount") == m["qualifiedFundsCount"], "Funnel qualified count mismatch"
          print(
              f"Dataset verified: {uf.get('totalCiksScanned', 0)} SEC CIKs -> {m['qualifiedFundsCount']} qualified funds "
              f"({uf.get('curatedQualifiedCount', 0)} curated / {uf.get('discoveredQualifiedCount', 0)} discovered), "
              f"{m['total13fFilingsProcessed']} filings, {len(d['fundUpdates'])} updates"
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path and uf:
              lines = [
                  f"## Paper Trail Full-Universe 13F Funnel ({m.get('latestQuarterCovered', '')})",
                  "",
                  f"**Method:** {uf.get('method', '')} ({uf.get('bulkDatasetsCount', 0)} bulk ZIPs through `{uf.get('bulkMaxFilingDate', '')}` + {uf.get('postBulkFilingsCount', 0):,} post-bulk filings)",
                  "",
                  "| Stage | Filter Description | Funds / CIKs |",
                  "|---|---|---:|",
                  f"| 1. Universe Scanned | All SEC 13F-HR / 13F-HR/A filers (2021–Present) | {uf.get('totalCiksScanned', 0):,} |",
                  f"| 2. Active Managers | Filed within 210 days / current filing cycle | {uf.get('activeRecentCount', 0):,} |",
                  f"| 3. Manager Filter | Exclude operating corps, mega-banks, insurers, pensions | {uf.get('nonExcludedManagerCount', 0):,} |",
                  f"| 4. Filing History | ≥4 quarters since 2024-01-01 (≥2 Curated) | {uf.get('fourPlusQuartersCount', 0):,} |",
                  f"| 5. Scale Screen | ≥$200M reported / ≥$100M equity AUM (15% bulk buffer) | {uf.get('sizeAndEquityPassCount', 0):,} |",
                  f"| 6. Concentration | 5+ pos, effN ≥ 1.4, & ≤130 pos (or ≤265 w/ Top-10 ≥48%) | {uf.get('concentrationPassCount', 0):,} |",
                  f"| 7. Tech/TMT Focus | ≥35% Tech/TMT discovered (≥30% Curated crossover) | {uf.get('techFloorPassCount', 0):,} |",
                  f"| 8. Strict Q3 Rules | Exact final quarter rules (≤120 pos or ≤250 w/ Top-10 ≥55%) | {uf.get('strictQualificationCount', 0):,} |",
                  f"| 9. Priced History Qualified | ≥$100M & ≥50% equity w/ live price history | {uf.get('qualifiedFundsCount', 0):,} |",
                  f"| 10. Top-100 Union | Ranked Top 100 in any window (QE / 45d Lag) | {uf.get('rankedUnionQeCount', 0):,} / {uf.get('rankedUnionLagCount', 0):,} |",
                  f"| 11. Ideal Portfolio | Synthesized risk-capped portfolio positions | {uf.get('idealPortfolioCount', 0):,} |",
              ]
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write("\n".join(lines) + "\n")
          PY

      - name: Commit updated 13F dataset & caches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolio_data.json pipeline/cusip_cache.json pipeline/ticker_meta_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): automated quarterly 13F & market data update"
            git pull --rebase origin main || true
            git push
          else
            echo "No dataset changes to commit."
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies & typecheck
        run: npm ci

      - name: Build static bundle
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
