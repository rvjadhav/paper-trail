name: Quarterly 13F Ingestion & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Peak 13F filing seasons (Feb, May, Aug, Nov) at 23:00 UTC (after SEC 5:30 PM ET close)
    - cron: '0 23 1,8,10,12,14,15,16,18,20,25 2,5,8,11 *'
    # Off-peak Sunday weekly market price & amendment refresh (never overlaps peak filing days)
    - cron: '0 23 * 1,3,4,6,7,9,10,12 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-13f-sync
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Restore SEC EDGAR & Yahoo cache (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: sec-edgar-cache-v1-${{ github.run_id }}
          restore-keys: |
            sec-edgar-cache-v1-

      - name: Run SEC EDGAR 13F pipeline (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_USER_AGENT: "PaperTrail13FResearch contact@papertrail13f.dev"
        run: python3 -u pipeline/build_data.py

      - name: Verify dataset integrity before commit/deploy
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("src/data/portfolio_data.json")
          assert p.exists() and p.stat().st_size >= 500_000, f"Dataset too small: {p.stat().st_size if p.exists() else 0}B"
          d = json.loads(p.read_text(encoding="utf-8"))
          m = d["metadata"]
          assert m["qualifiedFundsCount"] >= 25, f"Too few qualified funds: {m}"
          assert m["total13fFilingsProcessed"] >= 100, f"Too few filings: {m}"
          assert len(d.get("funds", [])) >= 25, "Missing funds list"
          assert len(d.get("fundUpdates", [])) >= 15, "Missing fundUpdates list"
          assert len(d.get("idealPortfolio", {}).get("positions", [])) >= 15, "Missing idealPortfolio positions"
          print(f"Dataset verified: {m['qualifiedFundsCount']} funds, {m['total13fFilingsProcessed']} filings, {len(d['fundUpdates'])} updates")

          wl = m.get("discoveryWatchlist") or {}
          cands = wl.get("emergingSeedCandidates") or []
          urgent = [c for c in cands if c.get("alertTier") == "URGENT"]
          stale = wl.get("staleSeeds") or []
          if urgent:
              tickers_csv = ", ".join(f"{c['ticker']} ({c['cusip']})" for c in urgent[:6])
              print(
                  f"::warning title=Discovery Seed Radar: Add {len(urgent)} Emerging Must-Hold Stocks to DISCOVERY_SEED_PAIRS"
                  f"::Top-75 funds surged into unseeded Tech/TMT names: {tickers_csv}. Review pipeline/funds_config.py or open Methodology -> Discovery Seed Radar."
              )
          if stale:
              stale_csv = ", ".join(s["ticker"] for s in stale)
              print(f"::warning title=Discovery Seed Radar: Stale EFTS Seed Tickers::Low-coverage seeds: {stale_csv}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              lines = [
                  f"## Paper Trail 13F Pipeline Summary ({m.get('latestQuarterCovered', '')})",
                  f"- **Qualified Funds:** {m['qualifiedFundsCount']} | **Filings:** {m['total13fFilingsProcessed']} | **EFTS Seed Pairs:** {wl.get('seedPairCount', 28)}",
              ]
              if cands:
                  lines.extend([
                      "",
                      f"### Discovery Seed Radar ({len(cands)} Unseeded Breakout Tech/TMT Stocks, {len(urgent)} Urgent)",
                      "Consider appending high-conviction disruptors below to `DISCOVERY_SEED_PAIRS` in `pipeline/funds_config.py`:",
                      "",
                      "| Tier | Ticker | CUSIP | Holders (Top-75 / All) | QoQ New + Heavy Adds | TTM | Suggested Seed Pair |",
                      "|---|---|---|---|---|---|---|",
                  ])
                  for c in cands:
                      ttm_s = f"{c['stockTtmPct']:+.1f}%" if c.get("stockTtmPct") is not None else "N/A"
                      lines.append(
                          f"| {c['alertTier']} | **{c['ticker']}** | `{c['cusip']}` | {c['holderCount']} / {c['allQualifiedHolders']} | "
                          f"{c['newInitiationsCount']} new + {c['heavyAddsCount']} adds ({c['surgePct']:.0f}%) | {ttm_s} | `{c['suggestedPair']}` |"
                      )
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write("\n".join(lines) + "\n")
          PY

      - name: Commit updated 13F dataset & caches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolio_data.json pipeline/cusip_cache.json pipeline/ticker_meta_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): automated quarterly 13F & market data update"
            git pull --rebase origin main || true
            git push
          else
            echo "No dataset changes to commit."
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies & typecheck
        run: npm ci

      - name: Build static bundle
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
